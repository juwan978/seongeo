<!doctype html>
<html lang="ko">
<head>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101317" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="성어 뜻 맞히기">
<meta name="format-detection" content="telephone=no">
<title>성어 뜻 맞히기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#F4F5F7; --card:#FFFFFF; --ink:#16181C; --ink-2:#434B56; --ink-3:#7A838F;
  --rule:#D9DDE3; --rule-2:#E9ECF0;
  --blue:#1F4FA8; --blue-soft:#E7EDF9; --blue-line:#9FB8E4;
  --red:#C8342A; --red-soft:#FBEAE8;
  --green:#1E7A54; --green-soft:#E4F2EB;
  --amber:#9A6B12; --amber-soft:#F8EFDC;
  --on-blue:#FFFFFF;
  --shadow:0 1px 0 rgba(22,24,28,.05), 0 6px 20px -12px rgba(22,24,28,.35);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#101317; --card:#181C22; --ink:#E9ECF0; --ink-2:#AFB8C4; --ink-3:#7C8592;
    --rule:#2A313A; --rule-2:#21272E;
    --blue:#7FA5F0; --blue-soft:#1B2637; --blue-line:#3D5C8F;
    --red:#F2756A; --red-soft:#2E1C1B;
    --green:#5FC397; --green-soft:#16281F;
    --amber:#E0B25C; --amber-soft:#2A2214;
    --on-blue:#0C1119;
    --shadow:0 1px 0 rgba(0,0,0,.4), 0 10px 26px -14px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --paper:#101317; --card:#181C22; --ink:#E9ECF0; --ink-2:#AFB8C4; --ink-3:#7C8592;
  --rule:#2A313A; --rule-2:#21272E;
  --blue:#7FA5F0; --blue-soft:#1B2637; --blue-line:#3D5C8F;
  --red:#F2756A; --red-soft:#2E1C1B;
  --green:#5FC397; --green-soft:#16281F;
  --amber:#E0B25C; --amber-soft:#2A2214;
  --on-blue:#0C1119;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 10px 26px -14px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",sans-serif;
  font-size:16px; line-height:1.55;
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.han{font-family:"Noto Serif KR",serif}

#app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}

/* ---------- 헤더 ---------- */
.topbar{
  position:sticky;top:0;z-index:20;background:var(--paper);
  border-bottom:1px solid var(--rule-2);
}
.topbar .row{display:flex;align-items:center;gap:10px;padding:10px 14px 8px}
.iconbtn{
  appearance:none;border:1px solid var(--rule);background:var(--card);color:var(--ink-2);
  width:34px;height:34px;border-radius:9px;font-size:15px;line-height:1;cursor:pointer;
  display:grid;place-items:center;flex:none;
}
.iconbtn:active{transform:scale(.95)}
.steps{display:flex;gap:5px;flex:1;align-items:center}
.stepdot{height:4px;flex:1;border-radius:99px;background:var(--rule)}
.stepdot.on{background:var(--blue)}
.stepdot.done{background:var(--blue-line)}
.counter{font-size:12px;color:var(--ink-3);letter-spacing:.02em;flex:none}

/* ---------- 홈 ---------- */
.home{padding:26px 18px 40px;display:flex;flex-direction:column;gap:22px;flex:1}
.brand{display:flex;flex-direction:column;gap:6px}
.brand h1{
  margin:0;font-family:"Noto Serif KR",serif;font-weight:700;
  font-size:clamp(30px,9vw,40px);letter-spacing:-.02em;line-height:1.1;text-wrap:balance;
}
.brand .sub{color:var(--ink-3);font-size:13px;letter-spacing:.01em}

.progresscard{
  background:var(--card);border:1px solid var(--rule);border-radius:var(--r);
  padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;
}
.bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--rule-2)}
.bar span{display:block;height:100%}
.bar .b-know{background:var(--green)}
.bar .b-learn{background:var(--blue)}
.bar .b-hard{background:var(--red)}
.bar .b-new{background:var(--rule)}
.legend{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 14px}
.legend .lg{
  appearance:none;font-family:inherit;cursor:pointer;text-align:left;
  display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);
  background:transparent;border:1px solid transparent;border-radius:8px;
  padding:5px 7px;margin:-5px -7px;transition:background .12s,border-color .12s;
}
.legend .lg:hover{background:var(--rule-2)}
.legend .lg:active{border-color:var(--rule)}
.legend i{width:9px;height:9px;border-radius:3px;flex:none}
.legend b{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}

.btn{
  appearance:none;border:none;border-radius:12px;cursor:pointer;
  font-size:16px;font-weight:600;padding:15px 18px;width:100%;
  background:var(--blue);color:var(--on-blue);letter-spacing:-.01em;
  font-family:inherit;
}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--rule)}

.sectionlist{display:flex;flex-direction:column;gap:8px}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.twocol .btn{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:13px 10px;font-size:15px;line-height:1.25;
}
.twocol .btn span{
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:500;color:var(--ink-3);
}
.lab{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
.chip{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--rule);border-radius:11px;
  padding:11px 13px;font-size:14px;color:var(--ink);cursor:pointer;font-family:inherit;
}
.chip[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.chip .n{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-3)}
.chip .dots{display:flex;gap:3px;flex:none}
.chip .dots i{width:6px;height:6px;border-radius:99px}

.note{font-size:12.5px;color:var(--ink-3);line-height:1.6}

/* ---------- 문제 ---------- */
.play{flex:1;display:flex;flex-direction:column;padding:0 16px 20px}
.stagelabel{
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);padding:16px 2px 12px;display:flex;gap:8px;align-items:center;
}
.stagelabel em{font-style:normal;color:var(--blue)}

/* 문제: 성어를 크게 보여주고 뜻을 고른다 */
.prompt{
  text-align:center;padding:30px 8px 26px;display:flex;flex-direction:column;gap:9px;
  margin-top:auto;
}
.pko{
  font-size:clamp(34px,10vw,46px);font-weight:700;letter-spacing:-.03em;line-height:1.15;
  text-wrap:balance;
}
.hanrow{
  display:flex;justify-content:center;align-items:flex-start;
  gap:14px;flex-wrap:wrap;padding-top:2px;
}
.hanchar{display:flex;flex-direction:column;align-items:center;gap:3px;max-width:88px}
.hanchar .g{
  font-family:"Noto Serif KR",serif;font-weight:700;
  font-size:clamp(26px,7.2vw,32px);line-height:1.1;color:var(--ink-2);
}
.hanchar .h{
  font-size:11.5px;line-height:1.3;color:var(--ink-3);text-align:center;
  word-break:keep-all;
}
.combo{
  font-size:11px;color:var(--blue);border:1px solid var(--blue-line);
  border-radius:99px;padding:3px 9px;flex:none;background:var(--blue-soft);
  white-space:nowrap;
}

.choices{display:flex;flex-direction:column;gap:9px;margin-top:auto;padding-top:14px}
.choice{
  appearance:none;width:100%;text-align:left;cursor:pointer;font-family:inherit;
  background:var(--card);border:1px solid var(--rule);border-radius:12px;
  padding:14px 15px;font-size:15.5px;color:var(--ink);line-height:1.45;
  display:flex;align-items:center;gap:11px;transition:background .12s,border-color .12s;
}
.choice .kx{
  font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);
  border:1px solid var(--rule);border-radius:6px;width:20px;height:20px;
  display:grid;place-items:center;flex:none;
}
.choice:active{transform:translateY(1px)}
.choice.right{border-color:var(--green);background:var(--green-soft)}
.choice.right .kx{border-color:var(--green);color:var(--green)}
.choice.wrong{border-color:var(--red);background:var(--red-soft)}
.choice.wrong .kx{border-color:var(--red);color:var(--red)}
.choice[disabled]{cursor:default}

/* 정답 직후 한마디 */
.feedback{
  margin:14px 0 4px;border-radius:12px;padding:12px 14px;text-align:center;
  font-size:15px;font-weight:600;letter-spacing:-.01em;line-height:1.4;
  display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;
}
.feedback.good{background:var(--green-soft);color:var(--green);border:1px solid var(--green)}
.feedback.bad{background:var(--red-soft);color:var(--red);border:1px solid var(--red)}
.feedback.big{
  font-size:18px;padding:16px 14px;
  animation:pop .32s cubic-bezier(.2,1.2,.4,1);
}
.feedback .rec{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;border:1px solid currentColor;border-radius:99px;
  padding:2px 8px;opacity:.85;font-weight:500;
}
@keyframes pop{from{transform:scale(.94);opacity:.4}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.feedback.big{animation:none}}

/* 정답 공개 카드 */
.reveal{flex:1;display:flex;flex-direction:column;gap:14px;padding-top:6px}
.revealcard{
  background:var(--card);border:1px solid var(--rule);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden;
}
.revealcard .head{padding:18px 16px 14px;border-bottom:1px solid var(--rule-2);text-align:center}
.revealcard .ko{font-size:24px;font-weight:700;letter-spacing:-.02em}
.revealcard .hj{font-family:"Noto Serif KR",serif;font-weight:500;font-size:19px;color:var(--ink-2);margin-top:3px;letter-spacing:.08em}
.chartable{display:flex;flex-wrap:wrap;border-top:1px solid var(--rule-2)}
.chartable > div{
  flex:1 1 25%;min-width:70px;padding:11px 6px;text-align:center;
  border-right:1px solid var(--rule-2);border-bottom:1px solid var(--rule-2);
}
.chartable > div:last-child{border-right:none}
.chartable .cg{font-family:"Noto Serif KR",serif;font-weight:700;font-size:24px;line-height:1.2}
.chartable .ch{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.revealcard .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.kv{display:flex;flex-direction:column;gap:3px}
.kv .k{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.kv .v{font-size:15px;line-height:1.5}
.warnnote{
  background:var(--amber-soft);border:1px solid var(--amber);border-radius:10px;
  padding:10px 12px;font-size:13px;color:var(--ink);line-height:1.5;
}
.warnnote b{color:var(--amber)}

/* 결과 */
.result{padding:30px 18px;display:flex;flex-direction:column;gap:20px;flex:1}
.result h2{margin:0;font-family:"Noto Serif KR",serif;font-size:28px;font-weight:700;letter-spacing:-.02em}
.scorerow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.scorerow div{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:13px 10px;text-align:center}
.scorerow .n{font-family:"IBM Plex Mono",monospace;font-size:26px;font-weight:600;line-height:1.1}
.scorerow .t{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.misslist{display:flex;flex-direction:column;gap:7px}
.missrow{
  display:flex;align-items:baseline;gap:9px;background:var(--card);
  border:1px solid var(--rule);border-left:3px solid var(--red);border-radius:9px;padding:10px 12px;
}
.missrow .ko{font-weight:600;font-size:15px;flex:none}
.missrow .hj{font-family:"Noto Serif KR",serif;font-size:13px;color:var(--ink-3);flex:none}
.missrow .m{font-size:12.5px;color:var(--ink-2);margin-left:auto;text-align:right;line-height:1.4}

/* 오답노트 / 목록 */
.listview{padding:16px 16px 30px;display:flex;flex-direction:column;gap:10px;flex:1}
.entry{
  background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;
  display:flex;flex-direction:column;gap:5px;
}
.entry.hard{border-left:3px solid var(--red)}
.entry.know{border-left:3px solid var(--green)}
.entry.learn{border-left:3px solid var(--blue)}
.entry.new{border-left:3px solid var(--rule)}
.entry .t{display:flex;align-items:baseline;gap:8px}
.entry .t .ko{font-weight:600;font-size:15.5px}
.entry .t .hj{font-family:"Noto Serif KR",serif;font-size:14px;color:var(--ink-2);letter-spacing:.06em}
.entry .t .w{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--red)}
.entry .m{font-size:13.5px;color:var(--ink-2);line-height:1.5}
.entry .hn{font-size:12px;color:var(--ink-3)}
.searchbar{
  width:100%;padding:12px 14px;border-radius:11px;border:1px solid var(--rule);
  background:var(--card);color:var(--ink);font-size:15px;font-family:inherit;
}
.searchbar::placeholder{color:var(--ink-3)}
.filterrow{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px}
.fbtn{
  appearance:none;flex:none;cursor:pointer;font-family:"IBM Plex Mono",monospace;font-size:12px;
  border:1px solid var(--rule);background:var(--card);color:var(--ink-2);
  border-radius:99px;padding:7px 12px;
}
.fbtn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.empty{text-align:center;color:var(--ink-3);font-size:14px;padding:40px 10px}

/* ---------- 아이패드 등 넓은 화면 ---------- */
@media (min-width:700px){
  #app{max-width:660px}
  body{font-size:17px}
  .home{padding:44px 26px 56px;gap:26px}
  .brand h1{font-size:46px}
  .brand .sub{font-size:14px}
  .play{padding:0 26px 32px}
  .pko{font-size:52px}
  .hanchar .g{font-size:36px}
  .hanchar .h{font-size:13px}
  .hanrow{gap:18px}
  .prompt{padding:40px 8px 34px}
  .choices{gap:11px}
  .choice{padding:17px 19px;font-size:17px}
  .revealcard .ko{font-size:28px}
  .revealcard .hj{font-size:21px}
  .chartable .cg{font-size:28px}
  .btn{font-size:17px;padding:16px 20px}
  .result{padding:40px 26px}
  .listview{padding:20px 26px 40px}
}
/* 가로로 아주 넓을 때 위아래로 벌어지지 않게 */
@media (min-width:700px) and (min-height:900px){
  .choices{padding-top:30px}
}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.hide{display:none !important}
.footer{padding:20px 18px 34px;text-align:center;font-size:11.5px;color:var(--ink-3);line-height:1.6}
</style>

</head>
<body>

<script>

/* ============ 소리: 딩동 / 땡 ============ */
let AC = null;
function ac() {
  if (AC === null) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = false; } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC || null;
}
function tone(freq, start, dur, vol, type) {
  const c = ac(); if (!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  const t0 = c.currentTime + start;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
let SOUND = true;
try { SOUND = localStorage.getItem('seongeo-sound') !== 'off'; } catch (e) { }
function dingdong() {
  if (!SOUND) return;
  tone(1174.7, 0, 0.30, 0.22);
  tone(880.0, 0.17, 0.42, 0.20);
}
function ttaeng() {
  if (!SOUND) return;
  tone(196.0, 0, 0.42, 0.20, 'triangle');
  tone(155.6, 0.05, 0.50, 0.16, 'triangle');
}

/* ============ 상태 ============ */
const KEY = 'seongeo-v1';
const DAY = 86400000;
const STEPS = [1, 2, 4, 9, 20, 45];      // 정답 연속 횟수별 복습 간격(일)
const BATCH = 12;                        // 한 번에 큐에 채우는 단위
const LENGTHS = [['endless', '끝까지'], ['40', '40개'], ['15', '15개']];
let sessionLen = localStorage.getItem('seongeo-len') || 'endless';

const byId = Object.fromEntries(DATA.map(d => [d.i, d]));
const SECTIONS = [...new Set(DATA.map(d => d.g))];

let CAN_SAVE = true;
let MEM = null;
(function probe() {
  try {
    localStorage.setItem(KEY + '-probe', '1');
    localStorage.removeItem(KEY + '-probe');
  } catch (e) { CAN_SAVE = false; }
})();

let store = load();
function load() {
  let s = {};
  try { s = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { s = {}; }
  if (!s.rec) s = { rec: {}, done: 0, best: 0 };
  const now = Date.now();
  for (const d of DATA) {
    if (!s.rec[d.i]) {
      // 교재 표시가 첫 출제 순서를 정한다: ★ 먼저, 무표시 다음, ○는 확인용으로 뒤에
      s.rec[d.i] = {
        n: 0, w: 0,
        d: d.s === 'known' ? now + 2 * DAY : 0,
        p: d.s === 'hard' ? 0 : (d.s === 'new' ? 1 : 2)
      };
    }
  }
  return s;
}
function save() {
  MEM = store;
  if (!CAN_SAVE) return;
  try { localStorage.setItem(KEY, JSON.stringify(store)); }
  catch (e) { CAN_SAVE = false; }
}

function statusOf(id) {
  const r = store.rec[id], base = byId[id].s;
  if (r.n >= 3) return 'know';
  if (r.n >= 1) return 'learn';
  if (base === 'hard' || r.w >= 2) return 'hard';
  if (base === 'known') return 'know';
  return 'new';
}
// 오답 노트 대상: 내가 틀린 적이 있고, 아직 확실히 외우지 못한 것
function isWrongNote(id) {
  const r = store.rec[id];
  return r.w > 0 && r.n === 0;   // 맞히면 바로 목록에서 빠지고, 또 틀리면 다시 들어온다
}
function wrongPool() {
  return DATA.filter(d => filterSections.has(d.g) && isWrongNote(d.i));
}

function startOfToday() {
  const n = new Date(); n.setHours(0, 0, 0, 0); return n.getTime();
}
function solvedToday() {
  const t0 = startOfToday();
  return DATA.filter(d => filterSections.has(d.g) && (store.rec[d.i].t || 0) >= t0);
}
function notSolvedToday() {
  const t0 = startOfToday();
  return DATA.filter(d => filterSections.has(d.g) && (store.rec[d.i].t || 0) < t0);
}
function solvedEver() {
  return DATA.filter(d => filterSections.has(d.g) && store.rec[d.i].t);
}
function byStatus(st) {
  return DATA.filter(d => filterSections.has(d.g) && statusOf(d.i) === st);
}

function counts(pool) {
  const c = { know: 0, learn: 0, hard: 0, new: 0 };
  for (const d of pool) c[statusOf(d.i)]++;
  return c;
}

const $ = h => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstElementChild; };
const app = document.getElementById('app');
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; } return a; }
function pick(a, n, not = []) { return shuffle(a.filter(x => !not.includes(x))).slice(0, n); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function praiseFor(streak) {

  return null;

/* ============ 세션 구성 ============ */
let S = null;

// 아직 이 세션에서 안 나온 것 중 우선순위 높은 n개
function pickBatch(n) {
  const now = Date.now();
  const base = S.mode === 'wrong'
    ? wrongPool()
    : (S.mode === 'list' ? S.list : DATA.filter(d => filterSections.has(d.g)));
  const pool = base.filter(d => !S.seen.has(d.i));
  if (!pool.length) return [];
  const ready = pool.filter(d => store.rec[d.i].d <= now);
  const src = (ready.length ? ready : pool).slice();
  src.sort((a, b) => {
    const ra = store.rec[a.i], rb = store.rec[b.i];
    if (ra.p !== rb.p) return ra.p - rb.p;       // ★ → 무표시 → ○
    if (rb.w !== ra.w) return rb.w - ra.w;       // 많이 틀린 것 먼저
    return ra.d - rb.d;
  });
  const batch = shuffle(src.slice(0, n * 2)).slice(0, n);
  batch.forEach(d => S.seen.add(d.i));
  return batch;
}

function startSession(mode, list, label) {
  S = {
    mode: mode || 'all', list: list || [], label: label || '',
    seen: new Set(), queue: [],
    idx: 0, right: 0, missed: [], total: 0, cleared: [], streak: 0, bestStreak: 0,
    endless: (mode === 'wrong' || mode === 'list') ? true : sessionLen === 'endless',
    cap: (mode === 'wrong' || mode === 'list') ? Infinity
      : (sessionLen === 'endless' ? Infinity : parseInt(sessionLen, 10))
  };
  S.queue = pickBatch(Math.min(BATCH, S.cap));
  if (!S.queue.length) return screenResult();
  nextItem();
}

function remainingInPool() {
  const base = S.mode === 'wrong' ? wrongPool()
    : (S.mode === 'list' ? S.list : DATA.filter(d => filterSections.has(d.g)));
  return base.filter(d => !S.seen.has(d.i)).length;
}

function nextItem() {
  if (S.idx >= S.queue.length) {
    if (S.total < S.cap) {
      // 계속 모드: 다음 묶음을 이어서 낸다
      const more = pickBatch(Math.min(BATCH, S.cap - S.total));
      if (!more.length) return screenResult();
      S.queue = more; S.idx = 0;
    }
    else return screenResult();
  }
  const d = S.queue[S.idx];
  S.cur = { d, wrongHere: false, locked: false };
  stageQuiz();
}

/* ============ 문제 화면 ============ */
function topbar() {
  const pct = S.endless ? 0 : Math.min(100, S.total / S.cap * 100);
  return `<div class="topbar"><div class="row">
    <button class="iconbtn" id="quit" aria-label="나가기">✕</button>
    <div class="steps">
      ${S.endless
        ? `<span class="stepdot done" style="flex:${Math.min(S.total, 40)}"></span><span class="stepdot" style="flex:${Math.max(40 - S.total, 4)}"></span>`
        : `<span class="stepdot on" style="flex:${pct || 0.5}"></span><span class="stepdot" style="flex:${100 - pct || 0.5}"></span>`}
    </div>
    ${S.streak >= 3 ? `<span class="combo mono">${S.streak}연속</span>` : ''}
    <span class="counter mono">${S.mode === 'wrong' ? '오답 ' : ''}${S.endless ? (S.total + 1) + '번째' : (S.total + 1) + '/' + S.cap}</span>
  </div></div>`;
}

function stageQuiz() {
  const { d } = S.cur;
  const sameSec = DATA.filter(x => x.g === d.g && x.i !== d.i && x.m !== d.m);
  const near = sameSec.slice().sort((a, b) =>
    Math.abs(a.m.length - d.m.length) - Math.abs(b.m.length - d.m.length));
  const wrongs = pick(near.slice(0, 40).map(x => x.m), 3, [d.m]);
  const opts = shuffle([d.m, ...wrongs]);

  app.innerHTML = topbar();
  app.append($(`<div class="play">
    <div class="stagelabel">${S.mode === 'wrong' ? '<em style="color:var(--red)">오답 다시 풀기</em>'
      : S.mode === 'list' ? `<em>${esc(S.label || '골라서 풀기')}</em>`
      : '<em>뜻 고르기</em>'}</div>
    <div class="prompt">
      <div class="pko">${esc(d.k)}</div>
      <div class="hanrow">${d.c.map(c => `
        <div class="hanchar">
          <span class="g han">${esc(c[0])}</span>
          <span class="h">${esc(c[1])}<br>${esc(c[2])}</span>
        </div>`).join('')}</div>
    </div>
    <div class="choices" id="ch"></div>
  </div>`));
  document.getElementById('quit').onclick = quit;

  const box = document.getElementById('ch');
  opts.forEach((o, i) => {
    const b = $(`<button class="choice" data-v="${esc(o)}"><span class="kx mono">${i + 1}</span><span>${esc(o)}</span></button>`);
    b.onclick = () => {
      if (S.cur.locked) return;
      S.cur.locked = true;
      [...box.children].forEach(x => x.disabled = true);
      const ok = o === d.m;
      if (ok) dingdong(); else { ttaeng(); S.cur.wrongHere = true; b.classList.add('wrong'); }
      [...box.children].forEach(x => { if (x.dataset.v === d.m) x.classList.add('right'); });
      setTimeout(() => finishItem(), ok ? 380 : 900);
    };
    box.append(b);
  });
}

/* --- 정답 공개 --- */
function finishItem() {
  const { d, wrongHere } = S.cur;
  const r = store.rec[d.i];
  S.total++;
  let msg;
  if (wrongHere) {
    r.n = 0; r.w++; r.d = Date.now(); r.p = 0;
    S.streak = 0;
    S.missStreak = (S.missStreak || 0) + 1;
    S.missed.push(d);        // 오답 노트에 쌓인다. 이 세션에서 다시 내지는 않는다
    msg = { text: r.w >= 3 ? rnd(REPEAT_MSG) : (S.missStreak >= 3 ? rnd(SLUMP_MSG) : rnd(BAD_MSG)), big: false };
  } else {
    S.streak++; S.bestStreak = Math.max(S.bestStreak, S.streak);
    S.missStreak = 0;
    msg = praiseFor(S.streak) || { text: rnd(OK_MSG), big: false };
    r.n++; r.w = Math.max(0, r.w - 0);
    r.d = Date.now() + STEPS[Math.min(r.n, STEPS.length - 1)] * DAY;
    if (r.p === 0 && r.n >= 2) r.p = 1;
    S.right++;
    S.cleared.push(d);
  }
  r.t = Date.now();                     // 마지막으로 푼 시각 — '오늘 푼 것' 집계에 쓴다
  store.done++;
  if (S.streak > (store.best || 0)) { store.best = S.streak; msg.record = true; }
  save();
  screenReveal(d, !wrongHere, msg);
}

function screenReveal(d, ok, msg) {
  app.innerHTML = topbar();
  const note = d.n ? `<div class="warnnote"><b>교재 오류</b> ${esc(d.n.replace(/^⚠\s*/, ''))}</div>` : '';
  const alt = d.l && d.l !== d.m ? `<div class="kv"><span class="k">글자 그대로</span><span class="v">${esc(d.l)}</span></div>` : '';
  const twins = DATA.filter(x => x.i !== d.i && x.m === d.m);
  const twinHTML = twins.length
    ? `<div class="kv"><span class="k">뜻이 같은 성어</span><span class="v">${twins.map(t => `${esc(t.k)}<span class="han" style="color:var(--ink-3);font-size:13px"> ${esc(t.h)}</span>`).join(' · ')}</span></div>`
    : '';
  app.append($(`<div class="play">
    <div class="feedback ${ok ? 'good' : 'bad'}${msg && msg.big ? ' big' : ''}">
      ${esc(msg ? msg.text : (ok ? '맞았어' : '다시 보자'))}
      ${msg && msg.record && S.streak >= 5 ? '<span class="rec">최고 기록</span>' : ''}
    </div>
    <div class="reveal">
      <div class="revealcard">
        <div class="head">
          <div class="ko">${esc(d.k)}</div>
          <div class="hj han">${esc(d.h)}</div>
        </div>
        <div class="chartable">
          ${d.c.map(c => `<div><div class="cg han">${esc(c[0])}</div><div class="ch">${esc(c[1])} ${esc(c[2])}</div></div>`).join('')}
        </div>
        <div class="body">
          ${alt}
          <div class="kv"><span class="k">뜻</span><span class="v">${esc(d.m)}</span></div>
          ${twinHTML}
          ${note}
        </div>
      </div>
      <button class="btn" id="next" style="margin-top:auto">다음</button>
    </div>
  </div>`));
  document.getElementById('quit').onclick = quit;
  document.getElementById('next').onclick = () => { S.idx++; nextItem(); };
}

function quit() {
  if (S && S.total > 0) screenResult();
  else screenHome();
}

  const leftAll = remainingInPool();
  const uniqMissedEarly = [...new Map(S.missed.map(d => [d.i, d])).values()];
  const uniqMissed = [...new Map(S.missed.map(d => [d.i, d])).values()];
  app.innerHTML = '';
  app.append($(`<div class="result">
    <h2>${acc >= 90 && S.total >= 10 ? '오늘 진짜 잘했다'
      : S.total >= 40 ? '오늘 많이 했다'
      : acc >= 80 ? '잘했다'
      : acc >= 50 ? '반은 잡았다'
      : '괜찮아, 이제 시작이야'}</h2>
    <div class="scorerow">
      <div><div class="n">${S.total}</div><div class="t">푼 문제</div></div>
      <div><div class="n" style="color:var(--green)">${S.right}</div><div class="t">맞힌 것</div></div>
      <div><div class="n" style="color:var(--blue)">${S.bestStreak}</div><div class="t">최고 연속</div></div>
    </div>
    ${S.bestStreak >= 10 ? `<div class="feedback good big">${S.bestStreak}연속까지 갔어. 이 정도면 자랑해도 돼</div>`
      : acc === 100 && S.total >= 10 ? `<div class="feedback good big">${S.total}문제 전부 정답. 완벽해</div>` : ''}
    ${uniqMissed.length ? `<div>
      <div class="lab" style="margin-bottom:8px">오답 노트에 담김 · ${uniqMissed.length}개</div>
      <div class="misslist">${uniqMissed.map(d => `
        <div class="missrow">
          <span class="ko">${esc(d.k)}</span>
          <span class="hj han">${esc(d.h)}</span>
          <span class="m">${esc(d.m.length > 26 ? d.m.slice(0, 26) + '…' : d.m)}</span>
        </div>`).join('')}</div>
    </div>` : ''}
    <div class="note">${S.mode === 'wrong'
      ? (leftAll ? `오답 노트에 <b>${leftAll}개</b> 더 남았어요` : '오답 노트를 다 돌았어요')
      : S.mode === 'list'
      ? (leftAll ? `이 묶음에 <b>${leftAll}개</b> 더 남았어요` : '이 묶음을 다 돌았어요')
      : `아직 안 나온 성어가 <b>${leftAll}개</b> 남았어요`}</div>
    <div style="display:flex;flex-direction:column;gap:9px;margin-top:auto">
      <button class="btn" id="more">${leftAll ? '이어서 풀기' : '처음부터 다시'}</button>
      <button class="btn ghost" id="home">홈으로</button>
    </div>
  </div>`));
  document.getElementById('more').onclick = () => {
    if (leftAll) {
      const seen = S.seen, mode = S.mode, list = S.list;
      startSession(mode, list);
      seen.forEach(i => S.seen.add(i));
      S.queue = pickBatch(Math.min(BATCH, S.cap));
      if (!S.queue.length) return screenResult();
      S.idx = 0; nextItem();
    } else startSession(S.mode, S.list);
  };
  document.getElementById('home').onclick = () => screenHome();
}

/* ============ 목록 / 오답노트 ============ */
function screenList(mode) {
  const isWrongView = mode === 'wrong';
  let q = '', filt = 'all';
  const wn = wrongPool().length;
  app.innerHTML = `<div class="topbar"><div class="row">
    <button class="iconbtn" id="back" aria-label="뒤로">←</button>
    <div style="flex:1;font-size:15px;font-weight:600">${isWrongView ? '오답 노트' : '전체 성어'}</div>
    ${isWrongView ? `<span class="counter mono">${wn}개</span>` : ''}
  </div></div>`;
  const wrap = $(`<div class="listview">
    ${isWrongView
      ? (wn
        ? `<button class="btn" id="playWrong" style="background:var(--red)">이 ${wn}개만 풀기</button>
           <div class="note">맞히면 노트에서 빠지고, 또 틀리면 다시 들어옵니다.</div>`
        : `<div class="empty">아직 틀린 성어가 없어요.<br>문제를 풀다 틀리면 여기에 모입니다.</div>`)
      : ''}
    <input class="searchbar" id="q" placeholder="성어·한자·뜻으로 찾기" autocomplete="off">
    ${isWrongView ? '' : '<div class="filterrow" id="f"></div>'}
    <div id="rows" style="display:flex;flex-direction:column;gap:9px"></div>
  </div>`);
  app.append(wrap);
  document.getElementById('back').onclick = () => screenHome();

  const pw = wrap.querySelector('#playWrong');
  if (pw) pw.onclick = () => startSession('wrong');

  const fbox = wrap.querySelector('#f');
  if (fbox) {
    const FILTERS = [['all', '전체'], ['hard', '못 외운 것'], ['learn', '외우는 중'], ['know', '외웠다'], ['new', '아직 안 봄']];
    FILTERS.forEach(([k, label]) => {
      const b = $(`<button class="fbtn" aria-pressed="${filt === k}">${label}</button>`);
      b.onclick = () => { filt = k;[...fbox.children].forEach(x => x.setAttribute('aria-pressed', 'false')); b.setAttribute('aria-pressed', 'true'); paint(); };
      fbox.append(b);
    });
  }

  const rows = wrap.querySelector('#rows');
  function paint() {
    const list = DATA.filter(d => {
      if (isWrongView && !isWrongNote(d.i)) return false;
      if (filt !== 'all' && statusOf(d.i) !== filt) return false;
      if (!q) return true;
      const s = q.toLowerCase();
      return d.k.includes(q) || d.h.includes(q) || d.m.toLowerCase().includes(s) ||
        d.c.some(c => c[1].includes(q) || c[2].includes(q));
    });
    if (!list.length) { rows.innerHTML = isWrongView && !q ? '' : `<div class="empty">찾는 성어가 없어요</div>`; return; }
    rows.innerHTML = list.slice(0, 300).map(d => {
      const st = statusOf(d.i), w = store.rec[d.i].w;
      return `<div class="entry ${st}">
        <div class="t">
          <span class="ko">${esc(d.k)}</span>
          <span class="hj han">${esc(d.h)}</span>
          ${w ? `<span class="w mono">${w}번 틀림</span>` : ''}
        </div>
        <div class="hn">${d.c.map(c => `${esc(c[0])} ${esc(c[1])} ${esc(c[2])}`).join(' · ')}</div>
        <div class="m">${esc(d.m)}</div>
        ${d.n ? `<div class="hn" style="color:var(--amber)">교재 오류 · ${esc(d.n.replace(/^⚠\s*/, ''))}</div>` : ''}
      </div>`;
    }).join('') + (list.length > 300 ? `<div class="empty">외 ${list.length - 300}개 — 검색해서 찾아보세요</div>` : '');
  }
  wrap.querySelector('#q').oninput = e => { q = e.target.value.trim(); paint(); };
  paint();
}

screenHome();
</script>
